<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de lançamentos — PagueLeve</title>

    <!-- Estilos da página (a estilização será feita por outro integrante) -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
</head>
<body>

    <!-- =========================================================
         HEADER — logo e navegação (igual nas 5 páginas)
         Figma: "Navbar" (desktop), "Topo" e "Tab bar" (mobile).
         ========================================================= -->
    <header class="cabecalho">
        <!-- TODO (CSS/assets): substituir o texto pelo logo "Logo/PagueLeve" exportado do Figma (pasta assets/) -->
        <a href="index.html" class="logo">PagueLeve</a>

        <!-- TODO (equipe): no Figma mobile, o topo mostra um ícone "ⓘ" à direita.
             A função dele não está definida no protótipo. -->

        <!-- Navegação entre as 5 páginas. O mesmo menu serve aos dois formatos:
             - desktop: menu horizontal no topo;
             - mobile: barra fixa na parte de baixo da tela.
             O link da página aberta tem aria-current="page" (item ativo no Figma).
             TODO (CSS): posicionar o menu conforme o tamanho da tela.
             TODO (CSS): no mobile, o Figma usa a ordem Início, Histórico, Registrar,
             Dívidas, Metas, com um ícone em cada item (home, lista, mais, calculadora, meta). -->
        <nav class="menu" aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="registrar.html">Registrar</a></li>
                <li><a href="historico.html" aria-current="page">Histórico</a></li>
                <li><a href="dividas.html">Dívidas</a></li>
                <li><a href="metas.html">Metas</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- =========================================================
             HISTÓRICO — telas "Histórico (MVP)" (desktop) e "Histórico" (mobile) do Figma
             TODO (GET): as linhas serão criadas em js/lista.js
             ========================================================= -->
        <section id="historico" class="secao-historico">
            <h1>Histórico de lançamentos</h1>
            <p>Consulte tudo o que você registrou.</p>

            <!-- TODO (bônus): filtros do Figma (Categoria, Período, Tipo; no mobile, só Categoria
                 e Período), feitos em JavaScript sobre a lista que a API devolve. -->

            <!-- TODO (CSS): no desktop, o Figma mostra uma tabela; no mobile, cada lançamento
                 aparece como um cartão ("Item de lançamento"), com o ícone da categoria. -->
            <table class="tabela-lancamentos">
                <thead>
                    <tr>
                        <th scope="col">Data</th>
                        <th scope="col">Descrição</th>
                        <th scope="col">Categoria</th>
                        <th scope="col">Tipo</th>
                        <th scope="col">Valor</th>
                        <!-- TODO (bônus): coluna para o botão de apagar (DELETE) -->
                    </tr>
                </thead>
                <tbody id="lista-lancamentos">
                    <!-- Mensagem provisória: será substituída pelos lançamentos vindos da API -->
                    <tr>
                        <td colspan="5">Nenhum lançamento carregado ainda.</td>
                    </tr>
                </tbody>
            </table>

            <!-- TODO (integração): quantidade de lançamentos e totais de gastos e dívidas,
                 calculados na tela com JavaScript. -->
            <p id="totais-historico" class="totais"></p>

            <!-- Botão redondo "+" do Figma mobile ("FAB Registrar"): leva à página de registro.
                 Só no mobile: o Figma desktop não mostra este botão. -->
            <a href="registrar.html" class="botao-flutuante apenas-mobile" aria-label="Registrar lançamento">+</a>
        </section>

    </main>

    <!-- =========================================================
         FOOTER — componente "Rodapé do site" do Figma (igual nas 5 páginas)
         ========================================================= -->
    <footer class="rodape">
        <!-- TODO (CSS/assets): substituir o texto pelo logo exportado do Figma -->
        <p class="logo">PagueLeve</p>
        <p>Simulações ilustrativas. As condições reais dependem de cada credor.</p>
    </footer>

    <!-- Scripts desta página: lista.js (busca e listagem com GET) e app.js (integração e totais).
         Por enquanto contêm apenas comentários TODO. -->
    <script src="js/lista.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
