<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar lançamento — PagueLeve</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/paginas.css">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
</head>
<body>

    <header class="cabecalho">
        <a href="index.html" class="logo">Pague<span>Leve</span></a>

        <nav class="menu" aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="registrar.html" aria-current="page">Registrar</a></li>
                <li><a href="historico.html">Histórico</a></li>
                <li><a href="dividas.html">Dívidas</a></li>
                <li><a href="metas.html">Metas</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section id="registrar" class="secao-registrar">
            <h1>Registrar lançamento</h1>
            <p>Gasto ou dívida: valor, categoria e data. Sem planilha.</p>

            <form id="form-lancamento" class="formulario">

                <fieldset id="tipo" class="campo grupo-opcoes controle-tipo">
                    <legend>Tipo</legend>
                    <label class="opcao">
                        <input type="radio" name="tipo" value="gasto" checked required>
                        <span>Gasto</span>
                    </label>
                    <label class="opcao">
                        <input type="radio" name="tipo" value="entrada">
                        <span>Entrada</span>
                    </label>
                    <label class="opcao">
                        <input type="radio" name="tipo" value="poupança">
                        <span>Poupança</span>
                    </label>
                    <label class="opcao">
                        <input type="radio" name="tipo" value="dívida">
                        <span>Dívida</span>
                    </label>
                </fieldset>

                <div class="campo">
                    <label for="valor">Valor (R$)</label>
                    <input type="number" id="valor" name="valor" min="0" step="0.01" placeholder="0,00" required>
                </div>

                <div class="campo">
                    <label for="data">Data</label>
                    <input type="date" id="data" name="data" required>
                </div>

                <fieldset id="categoria" class="campo grupo-opcoes categorias">
                    <legend>Categoria</legend>
                    <label class="opcao">
                        <input type="radio" name="categoria" value="alimentação" checked required>
                        <span>Alimentação</span>
                    </label>
                    <label class="opcao">
                        <input type="radio" name="categoria" value="transporte">
                        <span>Transporte</span>
                    </label>
                    <label class="opcao">
                        <input type="radio" name="categoria" value="moradia">
                        <span>Moradia</span>
                    </label>
                    <label class="opcao">
                        <input type="radio" name="categoria" value="saúde">
                        <span>Saúde</span>
                    </label>
                    <label class="opcao">
                        <input type="radio" name="categoria" value="lazer">
                        <span>Lazer</span>
                    </label>
                </fieldset>

                <div class="campo">
                    <label for="descricao">Descrição (opcional)</label>
                    <input type="text" id="descricao" name="descricao" maxlength="100" placeholder="Ex.: Mercado do mês">
                </div>

                <div class="botoes-formulario">
                    <button type="submit" class="botao botao-primario">Salvar lançamento</button>
                    <button type="reset" class="botao botao-secundario apenas-desktop">Cancelar</button>
                </div>
            </form>

    </main>


    <footer class="rodape">
        <p class="logo">Pague<span>Leve</span></p>
        <p>Simulações ilustrativas. As condições reais dependem de cada credor.</p>
    </footer>

    <script src="js/cadastro.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
